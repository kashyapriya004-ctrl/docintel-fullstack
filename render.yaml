services:
  - type: web
    name: docintel-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker backend.main:app
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: docintel-db
          engine: postgres
      - key: ALLOWED_ORIGINS
        sync: false
