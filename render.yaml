services:
  - type: web
    name: docintel-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false # You will add this string manually in the Render dashboard
      - key: DATABASE_URL
        sync: false # You will add your Neon postgres string here
